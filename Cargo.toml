[workspace]
members = [
    "crates/axint-cli",
    "crates/axint-core",
    "crates/axint-storage",
    "crates/axint-vfs",
    "crates/axint-net",
    "crates/axint-git-bridge",
    "crates/axint-installer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Axint Systems Engineering Team"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/aljojoby9/Axint"
homepage = "https://github.com/aljojoby9/Axint"
readme = "README.md"
keywords = ["vcs", "merkle", "cas"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
axint-core = { path = "crates/axint-core" }
axint-storage = { path = "crates/axint-storage" }
axint-vfs = { path = "crates/axint-vfs" }
axint-net = { path = "crates/axint-net" }
axint-git-bridge = { path = "crates/axint-git-bridge" }

blake3 = { version = "1.5", features = ["rayon", "mmap"] }
zstd = "0.13"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
uuid = { version = "1.8", features = ["v5", "v7", "fast-rng", "serde"] }

redb = "2.1"
prost = "0.13"
zerocopy = { version = "0.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2"
eyre = "0.6"
color-eyre = "0.6"
hex = "0.4"
smallvec = "1.15"
unicode-normalization = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }
crc32c = "0.6"
sha1 = "0.10"
flate2 = "1"
notify = "6"
bytes = "1"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"

tokio = { version = "1.38", features = ["full"] }
rayon = "1.10"
crossbeam-channel = "0.5"
parking_lot = "0.12"

quinn = "0.11"

clap = { version = "4.5", features = ["derive", "cargo", "env"] }
ratatui = "0.26"
crossterm = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Transitive crates such as `prost` and `tokio` pull duplicate versions.
multiple_crate_versions = "allow"
